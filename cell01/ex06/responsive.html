<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tab</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        table {
            height: 100vh;
            width: 100%;
        }

        table,
        td {
            border: 2px solid black;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            padding-top: 3.5rem;
            padding-bottom: 3.5rem;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td style="background-color: #c3c77e">First cell</td>
            <td style="background-color:#f9c4af">Second cell</td>
        </tr>
    </table>
</body>

</html>
